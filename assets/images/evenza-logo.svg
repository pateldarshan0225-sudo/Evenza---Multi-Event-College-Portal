<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 48" width="220" height="48" fill="none">
  <!-- BESPOKE HANDCRAFTED BRAND MARK (Geometric Monogram E) -->
  <g transform="translate(4, 4)">
    <!-- Base Capsule Container -->
    <rect x="0" y="0" width="40" height="40" rx="12" fill="#14171a"/>
    
    <!-- Precision Architectural E-Pill Bars -->
    <!-- Top Bar (Sun Gold) -->
    <rect x="10" y="10" width="20" height="5" rx="2.5" fill="#ffd13b"/>
    <!-- Middle Bar (White) -->
    <rect x="10" y="17.5" width="14" height="5" rx="2.5" fill="#ffffff"/>
    <!-- Bottom Bar (Sun Gold) -->
    <rect x="10" y="25" width="20" height="5" rx="2.5" fill="#ffd13b"/>
    <!-- Vertical Connecting Spine -->
    <rect x="10" y="10" width="5" height="20" rx="2.5" fill="#ffd13b"/>
  </g>

  <!-- HAND-KERNED ENTERPRISE TYPOGRAPHY: Evenza -->
  <text x="56" y="31" font-family="'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="25" letter-spacing="-0.03em" fill="#14171a">
    Even<tspan fill="#d97706">za</tspan>
  </text>

  <!-- Minimalist Status Dot -->
  <circle cx="168" cy="18" r="3.5" fill="#10b981"/>
</svg>
